name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Nothing by default: release-please acts through the GitHub App token, and
# publish asks for what it needs.
permissions: {}

# CI runs for back-to-back pushes to main can finish together. Two Release
# runs would then both act on the same merged release PR: one fails creating
# the tag, or both publish and the second is refused. Queue them instead, and
# never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    permissions:
      contents: read
    # workflow_run's branch filter matches the head branch name, which a fork
    # PR can also call main; release only after a push to this repo's main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # The commit the release was tagged at. release-please tags main as it
      # is when the job runs, which need not be the commit this run was
      # triggered for.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Mint a GitHub App installation token so release-please's PRs/tags are
      # authored by the App, not the default GITHUB_TOKEN. PRs created by the
      # default token cannot trigger other workflows (GitHub's anti-recursion
      # guard), which is why CI never ran on prior release PRs.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The package smoke test installs the packed tarball into an empty project,
  # so its dependencies resolve from the registry with no lockfile. That runs
  # here, in a job that cannot mint an npm token, and publish waits for it.
  verify-package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Install the packed tarball into an empty project and check the binary
      # serves tools over stdio, before anything is published.
      - run: pnpm run test:package

  publish:
    needs: [release-please, verify-package]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish exactly the tagged commit, so the npm version matches its tag
      # and changelog; the test steps below re-verify it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      # `node-version-file: false` opts out of v3's automatic .nvmrc detection.
      # Without it v3 would install Node, which setup-node below then reinstalls
      # and shadows on PATH — a wasted runtime download and two competing
      # runtimes in a publish job.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
          node-version-file: false
      # setup-node's `registry-url` writes the .npmrc that points npm at the
      # registry; `npm publish` authenticates through OIDC trusted publishing
      # (id-token: write), so no token secret is involved. pnpm/setup's
      # `runtime` input does not write that .npmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # No dependency cache: a poisoned cache entry would run in a job
          # that can mint an npm publish token.
      # No lifecycle scripts in a job that can mint an npm OIDC token: a
      # compromised allowed build (lefthook) could otherwise publish with valid
      # provenance. The build needs none of them.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      # Publish stays on npm — most battle-tested OIDC provenance + scoped-package flow.
      # pnpm install/build above produces identical dist/, so the published artifact is the same.
      - run: npm publish --provenance --access public
